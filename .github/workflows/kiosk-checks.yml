name: Kiosk checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m pip install pytest playwright jinja2
      - run: python3 -m playwright install --with-deps chromium
      - run: python3 -m pytest tests -v
      - run: bash -n install.sh scripts/setup-keyboard.sh
